name: ci

on:
  push:

permissions:
  contents: read

jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      BEND_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - run: curl -fsSL https://bend-lang.com/install.sh | sh
      - run: |
          export PATH="$HOME/.bend/bin:$PATH"
          nproc 2>/dev/null || sysctl -n hw.ncpu
          time bend PROOF.bend
